<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmO Settings</title>
<script src="_magpie/bridge.js"></script>
<script src="boot.js" defer></script>
<style>
body {
  font-family: var(--magpie-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  margin: 0;
  color: var(--magpie-muted, #888);
}
.loader {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.spinner {
  width: 14px;
  height: 14px;
  border: 2px solid var(--magpie-line, #ddd);
  border-top-color: var(--magpie-accent, #3b82f6);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <span>正在连接 OmO 设置服务…</span>
</div>
</body>
</html>
